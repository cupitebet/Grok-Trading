services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: gse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gse"]
      interval: 10s
      retries: 5

volumes:
  gse_pg:
