name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gse
          POSTGRES_PASSWORD: gse
          POSTGRES_DB: gse_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gse"
          --health-interval 5s
          --health-retries 10
    env:
      # Tes menjatuhkan dan membuat ulang schema public; hanya arahkan ke database tes ini.
      GSE_TEST_DATABASE_URL: postgresql://gse:gse@localhost:5432/gse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
